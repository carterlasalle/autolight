# CodeQL configuration (T-TRU-10 owner). JavaScript/TypeScript plus Python,
# security-and-quality queries. Run: part of `ci / security-codeql`.
name: autolight-codeql
queries:
  - uses: security-and-quality
paths-ignore:
  - "**/dist/**"
  - "**/node_modules/**"
  - "analysis/.venv/**"
  - "apps/desktop/e2e/**"
  - "apps/desktop/journeys/**"
  - "test-results/**"
  - "playwright-report/**"
  - "**/*.test.ts"
