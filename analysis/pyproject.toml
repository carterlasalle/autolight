[project]
name = "autolight-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pyrekordbox>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autolight_analysis"]

[dependency-groups]
dev = ["pytest>=8"]
ml = ["all-in-one-infer>=3.1.0", "beat-this>=1.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
