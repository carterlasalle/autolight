id: BC-000001
title: 'Runtime clock age divided by 1000: nanosecond state age read as milliseconds'
status: confirmed
created_at: '2026-10-01T08:23:08+00:00'
language: typescript
severity: medium
confidence: high
symptom: >-
  show-runtime tickWorld computed ageMs as Number(nowNs - receivedAtNs) / 1000,
  so a 300 ms provider gap reported 300000 milliseconds. clockHealth sat below
  runtime.health.extrapolateMs and runtime.health.holdMs for gaps up to 1000x
  too long: no extrapolation window, no hold, no adaptive clock, and the status
  bar stayed "live" through a dead provider.
root_cause: >-
  Nanosecond timestamps were divided by MS_PER_SECOND (1000) instead of 1e6, so
  the value compared against the millisecond thresholds was microseconds.
violated_invariant: >-
  runtime.health.extrapolateMs and runtime.health.holdMs are milliseconds: a
  bigint-nanosecond delta must be divided by 1e6 before any comparison.
detector_status: tested
source: regression-test
fix_summary: >-
  NS_PER_MS = 1e6 in packages/show-runtime/src/index.ts; the regression test
  packages/show-runtime/src/source-loss.test.ts asserts the three health
  windows (300 ms extrapolates, 1.5 s holds, 10 s degrades).
family_id: ''
related_candidates: []
